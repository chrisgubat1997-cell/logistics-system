<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LOGI-TECH | Forgot Password</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo-container">

                <img
                    src="assets/logo.jfif"
                    alt="LOGI-TECH Logo"
                >

            </div>


            <!-- TITLE -->
            <h1>FORGOT PASSWORD</h1>

            <p class="subtitle">
                Enter your username to recover your account
            </p>


            <!-- FORM -->
            <form id="forgotForm">

                <div class="input-group">

                    <label for="forgotUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="forgotUsername"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    RECOVER PASSWORD

                </button>

            </form>


            <!-- MESSAGE -->
            <p id="forgotMessage"></p>


            <!-- NAVIGATION -->
            <div class="login-links">

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </div>


    <script src="js/forgot-password.js"></script>

</body>

</html>
