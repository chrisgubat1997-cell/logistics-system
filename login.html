<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGI-TECH | Login</title>
    <!-- Font Awesome para sa mga icons sa loob ng input box -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">

            <!-- Banner / Header Image -->
            <div class="logo-container">
                <img src="assets/logo.jfif" alt="LOGI-TECH Logo">
            </div>

            <div class="card-body">
                <h1>Login</h1>

                <form id="loginForm">

                    <!-- Username Input -->
                    <div class="input-group">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Username" 
                            required
                        >
                    </div>

                    <!-- Password Input -->
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Password" 
                            required
                        >
                    </div>

                    <!-- Toggle Switch at Forgot Password Row -->
                    <div class="options-row">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span class="toggle-slider"></span>
                            <span class="label-text">remember me</span>
                        </label>

                        <a href="forgot-password.html" class="forgot-pass">
                            forgot password
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>

                <p id="loginMessage"></p>

                <!-- Create Account Link -->
                <div class="login-links">
                    <a href="signup.html">Create Account</a>
                </div>
            </div>

        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
