<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOGIS-TECH | Login</title>

<link
    rel="stylesheet"
    href="css/login.css"
>
```

</head>

<body>

```
<div class="login-container">

    <div class="login-wrapper">

        <div class="login-card">

            <!-- LOGO -->

            <div class="logo-container">

                <img
                    src="assets/logo.png"
                    alt="LOGI-TECH Logo"
                >

            </div>


            <!-- CARD CONTENT -->

            <div class="card-body">

                <h1>
                    LOGI-TECH LOGIN
                </h1>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <div class="input-group">

                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <button
    type="submit"
    class="login-btn"
>
    LOGIN
</button>

                </form>


                <!-- MESSAGE -->

                <p id="loginMessage"></p>


                <!-- LINKS -->

                <div class="login-links">

                    <a href="signup.html">
                        Sign Up
                    </a>

                    <br><br>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="js/login.js"></script>

</body>

</html>
