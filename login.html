<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Login</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <style>
        .login-sound-control {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 11px 17px;
            background: rgba(8, 18, 30, 0.82);
            color: #fff;
            font: 600 12px/1.2 Arial, sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .login-sound-control:hover {
            background: rgba(8, 18, 30, 0.96);
            transform: translateY(-2px);
        }

        .login-sound-control:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .login-sound-control {
                right: 14px;
                bottom: 14px;
                padding: 10px 14px;
            }
        }
    </style>

</head>


<body>
<!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <div class="login-wrapper">


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="login-card">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <div class="logo-container">

                    <img
                        src="assets/logo.png"
                        alt="LOGI-TECH Logo"
                    >

                </div>


                <!-- =================================================
                     CARD BODY
                ================================================== -->

                <div class="card-body">


                    <!-- =================================================
                         LOGIN FORM
                    ================================================== -->

                    <form
                        id="loginForm"
                        autocomplete="on"
                    >


                        <!-- =============================================
                             USERNAME
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="username"
                                class="sr-only"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- =============================================
                             PASSWORD
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="password"
                                class="sr-only"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- =============================================
                             LOGIN BUTTON
                        ============================================== -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-btn"
                        >
                            LOGIN
                        </button>


                    </form>


                    <!-- =================================================
                         LOGIN MESSAGE
                    ================================================== -->

                    <p
                        id="loginMessage"
                        aria-live="polite"
                    ></p>


                    <!-- =================================================
                         ACCOUNT LINKS
                    ================================================== -->

                    <div class="login-links">

                        <a
                            href="signup.html"
                        >
                            Sign Up
                        </a>

                        <span class="link-separator">
                            |
                        </span>

                        <a
                            href="forgot-password.html"
                        >
                            Forgot Password?
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        src="js/login.js"
    ></script>
</body>

</html>
