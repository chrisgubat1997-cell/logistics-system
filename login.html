<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Login</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <style>
        .login-sound-control {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 10000;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 11px 17px;
            background: rgba(8, 18, 30, 0.82);
            color: #fff;
            font: 600 12px/1.2 Arial, sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .login-sound-control:hover {
            background: rgba(8, 18, 30, 0.96);
            transform: translateY(-2px);
        }

        .login-sound-control:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .login-sound-control {
                right: 14px;
                bottom: 14px;
                padding: 10px 14px;
            }
        }
    </style>

</head>


<body class="intro-active">

    <!-- CINEMATIC LOGIN INTRO -->
    <section id="introScreen" class="intro-screen" aria-label="LOGIS-TECH introduction">
        <div class="intro-art">
            <img class="intro-monitor-image" src="assets/login-monitor.png" alt="">
            <video
                id="introVideo"
                class="intro-monitor-video"
                src="assets/login-intro.mp4"
                autoplay
                muted
                playsinline
                preload="auto"
                aria-label="LOGIS-TECH introduction video"
            ></video>
        </div>
            <button type="button" id="introPlayButton" class="intro-play-button" aria-label="Play introduction video and sound">
                <span class="intro-play-icon" aria-hidden="true">▶</span>
                <span>PLAY</span>
            </button>
        </div>
    </section>

    <!-- LOGIN BACKGROUND MUSIC -->
    <audio
        id="loginMusic"
        src="assets/login-music.mp3"
        preload="auto"
        loop
    ></audio>

    <button
        type="button"
        id="loginSoundControl"
        class="login-sound-control"
        aria-pressed="true"
        aria-label="Turn background music off"
        hidden
    >♫ SOUND ON</button>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <div class="login-wrapper">


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="login-card">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <div class="logo-container">

                    <img
                        src="assets/logo.png"
                        alt="LOGI-TECH Logo"
                    >

                </div>


                <!-- =================================================
                     CARD BODY
                ================================================== -->

                <div class="card-body">


                    <!-- =================================================
                         LOGIN FORM
                    ================================================== -->

                    <form
                        id="loginForm"
                        autocomplete="on"
                    >


                        <!-- =============================================
                             USERNAME
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="username"
                                class="sr-only"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- =============================================
                             PASSWORD
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="password"
                                class="sr-only"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- =============================================
                             LOGIN BUTTON
                        ============================================== -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-btn"
                        >
                            LOGIN
                        </button>


                    </form>


                    <!-- =================================================
                         LOGIN MESSAGE
                    ================================================== -->

                    <p
                        id="loginMessage"
                        aria-live="polite"
                    ></p>


                    <!-- =================================================
                         ACCOUNT LINKS
                    ================================================== -->

                    <div class="login-links">

                        <a
                            href="signup.html"
                        >
                            Sign Up
                        </a>

                        <span class="link-separator">
                            |
                        </span>

                        <a
                            href="forgot-password.html"
                        >
                            Forgot Password?
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        src="js/login.js"
    ></script>

    <script>
    (function () {
        const intro = document.getElementById("introScreen");
        const video = document.getElementById("introVideo");
        const music = document.getElementById("loginMusic");
        const soundControl = document.getElementById("loginSoundControl");
        const playButton = document.getElementById("introPlayButton");

        if (!intro || !video || !playButton) {
            document.body.classList.remove("intro-active");
            return;
        }

        let started = false;
        let finished = false;
        let soundOn = true;

        if (music) music.volume = 0.28;

        function updateSoundButton() {
            if (!soundControl) return;
            soundControl.textContent = soundOn ? "♫ SOUND ON" : "♫ SOUND OFF";
            soundControl.setAttribute("aria-pressed", String(soundOn));
            soundControl.setAttribute(
                "aria-label",
                soundOn ? "Turn background music off" : "Turn background music on"
            );
        }

        function finishIntro() {
            if (finished) return;
            finished = true;

            if (music) {
                music.pause();
                music.currentTime = 0;
            }
            if (soundControl) soundControl.hidden = true;

            intro.classList.add("intro-screen--leaving");
            document.body.classList.remove("intro-active");
            document.body.classList.add("intro-finished");
            window.setTimeout(function () {
                intro.hidden = true;
            }, 1000);
        }

        playButton.addEventListener("click", async function () {
            if (started || finished) return;
            started = true;
            playButton.disabled = true;
            playButton.classList.add("is-starting");
            playButton.innerHTML = '<span class="intro-play-icon" aria-hidden="true">▶</span><span>STARTING...</span>';

            if (soundControl) soundControl.hidden = false;

            const videoPromise = video.play();
            const musicPromise = music ? music.play() : Promise.resolve();

            try {
                await videoPromise;
                playButton.hidden = true;
            } catch (error) {
                console.error("LOGI-TECH intro video could not play:", error);
                playButton.disabled = false;
                playButton.classList.remove("is-starting");
                playButton.innerHTML = '<span class="intro-play-icon" aria-hidden="true">▶</span><span>TRY AGAIN</span>';
                if (music) music.pause();
                if (soundControl) soundControl.hidden = true;
                started = false;
                return;
            }

            try {
                await musicPromise;
                soundOn = true;
                updateSoundButton();
            } catch (error) {
                console.info("LOGI-TECH music playback was blocked:", error);
                soundOn = false;
                if (soundControl) {
                    soundControl.textContent = "♫ SOUND OFF";
                    soundControl.setAttribute("aria-pressed", "false");
                    soundControl.setAttribute("aria-label", "Turn background music on");
                }
            }
        });

        if (soundControl && music) {
            soundControl.addEventListener("click", async function () {
                if (soundOn) {
                    music.pause();
                    soundOn = false;
                } else {
                    try {
                        await music.play();
                        soundOn = true;
                    } catch (error) {
                        console.warn("LOGI-TECH music playback failed:", error);
                        soundOn = false;
                    }
                }
                updateSoundButton();
            });
        }

        video.addEventListener("ended", finishIntro, { once: true });
        video.addEventListener("error", function () {
            if (started) finishIntro();
        }, { once: true });

        window.addEventListener("pagehide", function () {
            video.pause();
            if (music) {
                music.pause();
                music.currentTime = 0;
            }
        }, { once: true });
    })();
    </script>ipt>


</body>

</html>
