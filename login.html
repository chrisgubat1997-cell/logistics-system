<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOGI-TECH | Login</title>

<link
    rel="stylesheet"
    href="css/login.css"
>
```

</head>

<body>

```
<div class="login-container">

    <div class="login-card">

        <div class="logo-container">

            <img
                src="assets/logo.png"
                alt="LOGI-TECH Logo"
            >

        </div>

        <h1>
            LOGI-TECH
        </h1>

        <p class="subtitle">
            Logistics Management System
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                LOGIN
            </button>

        </form>


        <p id="loginMessage"></p>


        <div class="login-links">

            <a href="signup.html">
                Sign Up
            </a>

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>

    </div>

</div>


<script src="js/login.js"></script>
```

</body>

</html>
