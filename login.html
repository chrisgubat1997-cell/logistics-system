<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Login</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <div class="login-wrapper">


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="login-card">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <div class="logo-container">

                    <img
                        src="assets/logo.png"
                        alt="LOGI-TECH Logo"
                    >

                </div>


                <!-- =================================================
                     CARD BODY
                ================================================== -->

                <div class="card-body">


                    <!-- =================================================
                         LOGIN FORM
                    ================================================== -->

                    <form
                        id="loginForm"
                        autocomplete="on"
                    >


                        <!-- =============================================
                             USERNAME
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="username"
                                class="sr-only"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- =============================================
                             PASSWORD
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="password"
                                class="sr-only"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- =============================================
                             LOGIN BUTTON
                        ============================================== -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-btn"
                        >
                            LOGIN
                        </button>


                    </form>


                    <!-- =================================================
                         LOGIN MESSAGE
                    ================================================== -->

                    <p
                        id="loginMessage"
                        aria-live="polite"
                    ></p>


                    <!-- =================================================
                         ACCOUNT LINKS
                    ================================================== -->

                    <div class="login-links">

                        <a
                            href="signup.html"
                        >
                            Sign Up
                        </a>

                        <span class="link-separator">
                            |
                        </span>

                        <a
                            href="forgot-password.html"
                        >
                            Forgot Password?
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        src="js/login.js"
    ></script>


</body>

</html>
