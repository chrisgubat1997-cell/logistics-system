<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LOGIS-TECH | Login</title>

<link
    rel="stylesheet"
    href="css/login.css"
>
```

</head>

<body>

```
<div class="login-container">

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo-container">

            <img
                src="assets/logo.png"
                alt="LOGI-TECH Logo"
            >

        </div>


        <!-- TITLE -->

        <h1>
            LOGI-TECH
        </h1>

        <p class="subtitle">
            Logistics Management System
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >
                LOGIN
            </button>


        </form>


        <!-- LOGIN MESSAGE -->

        <p id="loginMessage"></p>


        <!-- SIGN UP / FORGOT PASSWORD -->

        <div class="login-links">

            <a href="signup.html">
                Sign Up
            </a>

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>


    </div>

</div>


<!-- LOGIN JAVASCRIPT -->

<script src="js/login.js"></script>
```

</body>

</html>
