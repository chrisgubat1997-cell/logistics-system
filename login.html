<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Login</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body class="intro-active">

    <!-- CINEMATIC LOGIN INTRO -->
    <section id="introScreen" class="intro-screen" aria-label="LOGIS-TECH introduction">
        <div class="intro-art">
            <img class="intro-monitor-image" src="assets/login-monitor.png" alt="">
            <video
                id="introVideo"
                class="intro-monitor-video"
                src="assets/login-intro.mp4"
                autoplay
                muted
                playsinline
                preload="auto"
                aria-label="LOGIS-TECH introduction video"
            ></video>
        </div>
    </section>


    <!-- =====================================================
         LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <div class="login-wrapper">


            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="login-card">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <div class="logo-container">

                    <img
                        src="assets/logo.png"
                        alt="LOGI-TECH Logo"
                    >

                </div>


                <!-- =================================================
                     CARD BODY
                ================================================== -->

                <div class="card-body">


                    <!-- =================================================
                         LOGIN FORM
                    ================================================== -->

                    <form
                        id="loginForm"
                        autocomplete="on"
                    >


                        <!-- =============================================
                             USERNAME
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="username"
                                class="sr-only"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Username"
                                autocomplete="username"
                                required
                            >

                        </div>


                        <!-- =============================================
                             PASSWORD
                        ============================================== -->

                        <div class="input-group">

                            <label
                                for="password"
                                class="sr-only"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Password"
                                autocomplete="current-password"
                                required
                            >

                        </div>


                        <!-- =============================================
                             LOGIN BUTTON
                        ============================================== -->

                        <button
                            type="submit"
                            id="loginButton"
                            class="login-btn"
                        >
                            LOGIN
                        </button>


                    </form>


                    <!-- =================================================
                         LOGIN MESSAGE
                    ================================================== -->

                    <p
                        id="loginMessage"
                        aria-live="polite"
                    ></p>


                    <!-- =================================================
                         ACCOUNT LINKS
                    ================================================== -->

                    <div class="login-links">

                        <a
                            href="signup.html"
                        >
                            Sign Up
                        </a>

                        <span class="link-separator">
                            |
                        </span>

                        <a
                            href="forgot-password.html"
                        >
                            Forgot Password?
                        </a>

                    </div>


                </div>


            </div>


        </div>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT
    ====================================================== -->

    <script
        src="js/login.js"
    ></script>

    <script>
    (function () {
        const intro = document.getElementById("introScreen");
        const video = document.getElementById("introVideo");
        if (!intro || !video) {
            document.body.classList.remove("intro-active");
            return;
        }

        let finished = false;
        function finishIntro() {
            if (finished) return;
            finished = true;
            intro.classList.add("intro-screen--leaving");
            document.body.classList.remove("intro-active");
            document.body.classList.add("intro-finished");
            window.setTimeout(function () {
                intro.hidden = true;
            }, 1000);
        }

        video.addEventListener("ended", finishIntro, { once: true });
        video.addEventListener("error", finishIntro, { once: true });

        const startPlayback = function () {
            const playback = video.play();
            if (playback && typeof playback.catch === "function") {
                playback.catch(finishIntro);
            }
        };

        if (video.readyState >= 2) {
            startPlayback();
        } else {
            video.addEventListener("canplay", startPlayback, { once: true });
        }
    })();
    </script>


</body>

</html>
