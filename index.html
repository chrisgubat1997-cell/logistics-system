    <script>

        /* =========================================================
           MODULE STATES
           ========================================================= */

        let salesModuleLoaded = false;

        let deliveryModuleLoaded = false;

        let fleetAnalyticsModuleLoaded = false;

        let invoicingModuleLoaded = false;

        let paymentModuleLoaded = false;

        let systemSettingsModuleLoaded = false;


        /* =========================================================
           SHOW PAGE
           ========================================================= */

        function showPage(pageId, button) {

            /*
             * Hide every page
             */
            document
                .querySelectorAll('.page')
                .forEach(page => {

                    page.classList.remove('active');

                });


            /*
             * Show selected page
             */
            const selectedPage =
                document.getElementById(pageId);

            if (!selectedPage) {

                console.error(
                    'Page not found:',
                    pageId
                );

                return;

            }


            selectedPage.classList.add('active');


            /*
             * Update sidebar active state
             */
            document
                .querySelectorAll('.nav-item')
                .forEach(item => {

                    item.classList.remove('active');

                });


            if (button) {

                button.classList.add('active');

            }


            /*
             * Page title
             */
            const pageTitle =
                document.getElementById('pageTitle');


            const titles = {

                dashboard:
                    'Dashboard',

                sales:
                    'Sales Order',

                delivery:
                    'Delivery',

                fleetAnalytics:
                    'Fleet & Delivery Analytics',

                invoice:
                    'Invoice',

                payment:
                    'Payment',

                reports:
                    'Reports',

                profile:
                    'Profile',

                settings:
                    'Settings'

            };


            if (pageTitle) {

                pageTitle.textContent =
                    titles[pageId] || 'LOGIS-TECH SYSTEM';

            }


            /* =====================================================
               DASHBOARD
               ===================================================== */

            if (pageId === 'dashboard') {

                const dashboardFrame =
                    document.getElementById(
                        'dashboardFrame'
                    );

                if (
                    dashboardFrame &&
                    !dashboardFrame.src
                ) {

                    dashboardFrame.src =
                        'pages/dashboard.html';

                }

            }


            /* =====================================================
               SALES ORDER
               ===================================================== */

            if (pageId === 'sales') {

                loadSalesOrderModule();

            }


            /* =====================================================
               DELIVERY
               ===================================================== */

            if (pageId === 'delivery') {

                loadDeliveryModule();

            }


            /* =====================================================
               FLEET ANALYTICS
               ===================================================== */

            if (pageId === 'fleetAnalytics') {

                loadFleetAnalyticsModule();

            }


            /* =====================================================
               INVOICE
               ===================================================== */

            if (pageId === 'invoice') {

                loadInvoicingModule();

            }


            /* =====================================================
               PAYMENT
               ===================================================== */

            if (pageId === 'payment') {

                loadPaymentModule();

            }


            /* =====================================================
               OLD DR MODULE
               ===================================================== */

            if (pageId === 'dr') {

                if (
                    typeof loadDRModule === 'function'
                ) {

                    loadDRModule();

                }

            }


            /* =====================================================
               SETTINGS
               ===================================================== */

            if (pageId === 'settings') {

                loadSystemSettingsModule();

            }

        }


        /* =========================================================
           LOAD SCRIPT ONCE
           ========================================================= */

        function loadScriptOnce(
            src,
            attributeName
        ) {

            return new Promise(
                (resolve, reject) => {

                    /*
                     * Already loaded
                     */
                    const existingScript =
                        document.querySelector(
                            `script[${attributeName}]`
                        );


                    if (existingScript) {

                        resolve();

                        return;

                    }


                    /*
                     * Create script
                     */
                    const script =
                        document.createElement('script');


                    script.src = src;

                    script.setAttribute(
                        attributeName,
                        'true'
                    );


                    script.onload = () => {

                        resolve();

                    };


                    script.onerror = () => {

                        reject(
                            new Error(
                                `Failed to load script: ${src}`
                            )
                        );

                    };


                    document.body.appendChild(
                        script
                    );

                }
            );

        }


        /* =========================================================
           SALES ORDER MODULE
           ========================================================= */

        async function loadSalesOrderModule() {

            const container =
                document.getElementById(
                    'salesModule'
                );


            if (!container) {

                console.error(
                    'salesModule container not found.'
                );

                return;

            }


            if (salesModuleLoaded) {

                if (
                    typeof window.initializeSalesOrder ===
                    'function'
                ) {

                    window.initializeSalesOrder();

                }

                return;

            }


            try {

                const response =
                    await fetch(
                        `pages/sales-order.html?v=${Date.now()}`,
                        {
                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const html =
                    await response.text();


                container.innerHTML =
                    html;


                salesModuleLoaded =
                    true;


                await loadScriptOnce(
                    `js/sales-order.js?v=20261006`,
                    'data-sales-order-js'
                );


                if (
                    typeof window.initializeSalesOrder ===
                    'function'
                ) {

                    window.initializeSalesOrder();

                }

            } catch (error) {

                console.error(
                    'Sales Order module error:',
                    error
                );


                container.innerHTML = `

                    <div class="module-error">

                        <h3>
                            Unable to load Sales Order
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

        }

        /* =========================================================
           PAYMENT MODULE
           ========================================================= */

        async function loadPaymentModule() {

            const container =
                document.getElementById(
                    'paymentModule'
                );


            if (!container) {

                console.error(
                    'paymentModule container not found.'
                );

                return;

            }


            /*
             * If already loaded,
             * initialize again instead of fetching again.
             */
            if (paymentModuleLoaded) {

                if (
                    typeof window.initializePayment ===
                    'function'
                ) {

                    window.initializePayment();

                }

                return;

            }


            try {

                /*
                 * Load payment HTML
                 */
                const response =
                    await fetch(
                        `pages/payment.html?v=${Date.now()}`,
                        {
                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const html =
                    await response.text();


                /*
                 * Inject HTML
                 */
                container.innerHTML =
                    html;


                /*
                 * Mark as loaded
                 */
                paymentModuleLoaded =
                    true;


                /*
                 * Load payment JS
                 */
                await loadScriptOnce(
                    `js/payment.js?v=20261006`,
                    'data-payment-js'
                );


                /*
                 * Initialize payment module
                 */
                if (
                    typeof window.initializePayment ===
                    'function'
                ) {

                    window.initializePayment();

                }


            } catch (error) {

                console.error(
                    'Payment module error:',
                    error
                );


                container.innerHTML = `

                        class="module-error"
                        style="

                            border:1px solid #f1caca;
                            border-radius:10px;
                            background:#fff7f7;
                        "

                            Unable to load Payment

                        </p>

                            Please check that

        /* =========================================================
           LOGOUT
           ========================================================= */

        function logout() {

            try {

                localStorage.removeItem(
                    'logitechUser'
                );

            } catch (error) {

                console.error(
                    'Logout error:',
                    error
                );

            }


            window.location.href =
                'login.html';

        }


        /* =========================================================
           LOAD CURRENT USER
           ========================================================= */

        function loadCurrentUser() {

            const welcomeUser =
                document.getElementById(
                    'welcomeUser'
                );


            if (!welcomeUser) {

                return;

            }


            try {

                const storedUser =
                    localStorage.getItem(
                        'logitechUser'
                    );


                if (!storedUser) {

                    welcomeUser.textContent =
                        'WELCOME';

                    return;

                }


                const user =
                    JSON.parse(
                        storedUser
                    );


                const accountName =
                    user.accountName ||
                    user.name ||
                    user.fullName ||
                    user.username ||
                    'USER';


                welcomeUser.textContent =
                    `WELCOME ${accountName}`;

            } catch (error) {

                console.error(
                    'Unable to load current user:',
                    error
                );


                welcomeUser.textContent =
                    'WELCOME';

            }

        }


        /* =========================================================
           INITIALIZE APP
           ========================================================= */

            'DOMContentLoaded',
            function () {

                loadCurrentUser();


                /*
                 * Keep Dashboard active on first load

                    document.querySelector(
                        '.nav-item'
                    );


                if (dashboardButton) {

                    dashboardButton.classList.add(
