    <script>
    (function () {
        try {
            var saved = JSON.parse(localStorage.getItem('logitechSystemSettings') || '{}');
            var theme = saved.theme || 'light';
            if (theme === 'system') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    })();

/* =========================================================
   PAGE NAVIGATION
========================================================= */

function showPage(pageId, button) {

    console.log(
        'SHOW PAGE:',
        pageId
    );


    /* =====================================================
       HIDE ALL PAGES
    ===================================================== */

    document
        .querySelectorAll('.page')
        .forEach(function(page) {

            page.classList.remove(
                'active'
            );

        });


    /* =====================================================
       SHOW SELECTED PAGE
    ===================================================== */

    const page =
        document.getElementById(
            pageId
        );


    if (!page) {

        console.error(
            'Page not found:',
            pageId
        );

        return;

    }


    page.classList.add(
        'active'
    );

    // Match the active sidebar and section display with one accent color.
    const sectionAccents = {
        dashboard: '#16865b',
        sales: '#2563eb',
        joRegister: '#7c3aed',
        delivery: '#0891b2',
        fleetAnalytics: '#0d9488',
        fleetDataEntry: '#0f766e',
        invoice: '#d97706',
        payment: '#16a34a',
        revolvingFund: '#ca8a04',
        reports: '#4f46e5',
        settings: '#64748b',
        about: '#16865b',
        messages: '#2563eb',
        profile: '#2563eb'
    };

    const sectionAccent = sectionAccents[pageId] || '#2563eb';
    document.documentElement.style.setProperty('--section-accent', sectionAccent);
    document.documentElement.setAttribute('data-active-section', pageId);

/* =====================================================
       SIDEBAR ACTIVE BUTTON
    ===================================================== */

    document
        .querySelectorAll('.menu-btn')
        .forEach(function(btn) {

            btn.classList.remove(
                'active'
            );

        });


    if (button) {

        button.classList.add(
            'active'
        );


        const pageTitle =
            document.getElementById(
                'pageTitle'
            );


        if (pageTitle) {

            pageTitle.innerText =
                pageId === 'revolvingFund'
                    ? 'Revolving Fund Management'
                    : button.innerText.trim();

        }

    }


    /* =====================================================
       MESSAGING
    ===================================================== */
    if (pageId === 'messages' && typeof window.initializeMessages === 'function') {
        window.initializeMessages();
    }

    /* =====================================================
       SALES ORDER
    ===================================================== */

    if (
        pageId === 'sales'
    ) {

        loadSalesOrderModule();

    }


    /* =====================================================
       JO REGISTER
    ===================================================== */
    if (pageId === 'joRegister') {
        loadJORegisterModule();
    }

    /* =====================================================
       DELIVERY
    ===================================================== */

    if (
        pageId === 'delivery'
    ) {

        loadDeliveryModule();

    }


    /* =====================================================
       FLEET & DELIVERY ANALYTICS
    ===================================================== */

    if (
        pageId === 'fleetAnalytics'
    ) {

        loadFleetAnalyticsModule();

    }

    /* =====================================================
   FLEET & DELIVERY DATA ENTRY
===================================================== */

if (
    pageId === 'fleetDataEntry'
) {

    loadFleetDataEntryModule();

}

    /* =====================================================
       INVOICE
    ===================================================== */

    if (
        pageId === 'invoice'
    ) {

        loadInvoicingModule();

    }


/* =====================================================
   PAYMENT
===================================================== */

if (
    pageId === 'payment'
) {

    loadPaymentModule();

}

    /* =====================================================
   REPORTS
===================================================== */

if (
    pageId === 'reports'
) {

    loadReportModule();

}

    /* =====================================================
       DR
    ===================================================== */

    if (
        pageId === 'dr'
    ) {

        if (
            typeof loadDRSalesOrders ===
            'function'
        ) {

            loadDRSalesOrders();

        }

    }


    /* =====================================================
       REVOLVING FUND MANAGEMENT
    ===================================================== */
    if (pageId === 'revolvingFund') {
        loadRevolvingFundModule();
    }

    /* =====================================================
       SYSTEM SETTINGS
    ===================================================== */

    if (
        pageId === 'settings'
    ) {

        loadSystemSettingsModule();

    }

    /* ABOUT LOGIS-TECH */
    if (pageId === 'about') {
        loadAboutModule();
    }


    /* =====================================================
       DASHBOARD
    ===================================================== */

    if (
        pageId === 'dashboard'
    ) {

        if (
            typeof loadDashboard ===
            'function'
        ) {

            loadDashboard();

        }

    }

}



/* =========================================================
   LOAD SCRIPT ONCE
========================================================= */

function loadScriptOnce(
    src,
    attributeName
) {

    return new Promise(
        function(resolve, reject) {

            const existing =
                document.querySelector(
                    `script[${attributeName}]`
                );


            /* =================================================
               ALREADY EXISTS
            ================================================= */

            if (existing) {

                if (
                    existing.dataset.loaded ===
                    'true'
                ) {

                    resolve();

                    return;

                }


                existing.addEventListener(
                    'load',
                    function() {

                        resolve();

                    },
                    {
                        once: true
                    }
                );


                existing.addEventListener(
                    'error',
                    function() {

                        reject(
                            new Error(
                                'Failed to load ' +
                                src
                            )
                        );

                    },
                    {
                        once: true
                    }
                );


                return;

            }


            /* =================================================
               CREATE SCRIPT
            ================================================= */

            const script =
                document.createElement(
                    'script'
                );


            script.src =
                src;


            script.setAttribute(
                attributeName,
                'true'
            );


            script.onload =
                function() {

                    script.dataset.loaded =
                        'true';


                    console.log(
                        'Script loaded:',
                        src
                    );


                    resolve();

                };


            script.onerror =
                function() {

                    console.error(
                        'Failed to load:',
                        src
                    );


                    reject(
                        new Error(
                            'Failed to load ' +
                            src
                        )
                    );

                };


            document.body.appendChild(
                script
            );

        }
    );

}



/* =========================================================
   LOAD SALES ORDER MODULE
========================================================= */

async function loadSalesOrderModule() {

    console.log(
        'Loading Sales Order module...'
    );


    if (
        salesModuleLoaded
    ) {

        console.log(
            'Sales Order module already loaded.'
        );

        return;

    }


    const container =
        document.getElementById(
            'salesModule'
        );


    if (!container) {

        console.error(
            'salesModule not found.'
        );

        return;

    }


    try {

        const response =
            await fetch(
                'pages/sales-order.html?v=' +
                Date.now(),
                {
                    cache: 'no-store'
                }
            );


        if (!response.ok) {

            throw new Error(
                'Failed to load Sales Order module.'
            );

        }


        const html =
            await response.text();


        container.innerHTML =
            html;

        // Start Customer rendering immediately after its table exists.
        // Cached Customer data can appear while Sales Orders are loading.
        if (
            typeof loadCustomerTable ===
            'function'
        ) {

            loadCustomerTable();

        }


        salesModuleLoaded =
            true;


        console.log(
            'Sales Order HTML loaded.'
        );


        if (
            typeof loadSOList ===
            'function'
        ) {

            await loadSOList();

        }


    } catch (error) {

        console.error(
            'Sales Order module error:',
            error
        );


        container.innerHTML = `

            <div style="
                padding:30px;
                color:#b00020;
                background:#fff;
                border-radius:10px;
            ">

                Failed to load Sales Order module.

            </div>

        `;

    }

}



/* =========================================================

/* =========================================================
   LOAD REVOLVING FUND MANAGEMENT MODULE
========================================================= */
let revolvingFundModuleLoaded = false;
async function loadRevolvingFundModule() {
    const roleData = (function () {
        try {
            const u = JSON.parse(localStorage.getItem('logitechUser') || '{}');
            const a = u.account || u.user || u;
            return String(a.role || a.ROLE || a.accountType || a.account_type || a.accounttype || a.type || '').trim().toUpperCase();
        } catch (e) { return ''; }
    })();
    if (!['ADMIN', 'LOGISTICS'].includes(roleData)) {
        const container = document.getElementById('revolvingFundModule');
        if (container) container.innerHTML = '<div style="padding:24px;border:1px solid #e3e8ef;border-radius:12px"><h2>Access restricted</h2><p>This module is available to Logistics and Admin accounts only.</p></div>';
        return;
    }
    const container = document.getElementById('revolvingFundModule');
    if (!container) return;
    if (!revolvingFundModuleLoaded) {
        try {
            const response = await fetch('pages/revolving-fund.html?v=' + Date.now(), { cache: 'no-store' });
            if (!response.ok) throw new Error('Failed to load Revolving Fund page.');
            container.innerHTML = await response.text();
            revolvingFundModuleLoaded = true;
        } catch (error) {
            container.innerHTML = '<div style="padding:24px;color:#b42318">Unable to load Revolving Fund Management: ' + error.message + '</div>';
            return;
        }
    }
    try {
        await loadScriptOnce('js/revolving-fund.js?v=20261016-21', 'data-revolving-fund-js');
        if (typeof window.initializeRevolvingFund === 'function') window.initializeRevolvingFund();
    } catch (error) {
        console.error('Revolving Fund module initialization failed:', error);
        container.insertAdjacentHTML('afterbegin', '<div style="padding:12px;color:#b42318">Unable to initialize Revolving Fund module.</div>');
    }
}

        await loadScriptOnce('js/jo-register.js?v=20261020-allroles-readonly01', 'data-jo-register-js');
        if (typeof window.initializeJORegister === 'function') await window.initializeJORegister();
    } catch (error) {
        console.error('JO Register initialization failed:', error);
        container.insertAdjacentHTML('afterbegin', '<div class="jo-access-denied">Unable to initialize JO Register.</div>');
    }
}

/* =========================================================
   USER ACCOUNT
========================================================= */

function loadUserAccount() {

    const savedUser =
        localStorage.getItem(
            'logitechUser'
        );


    const loggedIn =
        localStorage.getItem(
            'logitechLoggedIn'
        );


    if (
        !savedUser ||
        loggedIn !== 'true'
    ) {

        window.location.href =
            'login.html';

        return;

    }


    let user;


    try {

        user =
            JSON.parse(
                savedUser
            );

    } catch (error) {

        localStorage.removeItem(
            'logitechUser'
        );

        localStorage.removeItem(
            'logitechLoggedIn'
        );

        window.location.href =
            'login.html';

        return;

    }


    document.querySelectorAll('[data-jo-register-menu]').forEach(function (button) {
        button.style.display = '';
    });

    // Messages is available to every authenticated/registered account, regardless of role.
    document.querySelectorAll('[data-messages-menu]').forEach(function (button) {
        button.style.setProperty('display', 'flex', 'important');
        button.style.setProperty('visibility', 'visible', 'important');
        button.style.setProperty('opacity', '1', 'important');
        button.disabled = false;
        button.removeAttribute('aria-hidden');
    });

    const fullname =
        user.fullname ||
        user.fullName ||
        user.username ||
        'USER';


    /* =================================================
       WELCOME
    ================================================= */

    const welcomeUser =
        document.getElementById(
            'welcomeUser'
        );


    if (
        welcomeUser
    ) {

        welcomeUser.innerText =
            'WELCOME, ' +
            fullname;

    }


    /* =================================================
       PROFILE NAME
    ================================================= */

    const profileName =
        document.getElementById(
            'profileName'
        );


    if (
        profileName
    ) {

        profileName.innerText =
            fullname;

    }


    /* =================================================
       PROFILE FULL NAME
    ================================================= */

    const profileFullname =
        document.getElementById(
            'profileFullname'
        );


    if (
        profileFullname
    ) {

        profileFullname.innerText =
            user.fullname ||
            user.fullName ||
            '-';

    }


    /* =================================================
       USERNAME
    ================================================= */

    const profileUsername =
        document.getElementById(
            'profileUsername'
        );


    if (
        profileUsername
    ) {

        profileUsername.innerText =
            user.username ||
            '-';

    }


    /* =================================================
       AVATAR
    ================================================= */

    const profileAvatar =
        document.getElementById(
            'profileAvatar'
        );


    if (
        profileAvatar
    ) {

        profileAvatar.innerText =
            fullname
                .charAt(0)
                .toUpperCase();

    }

}



/* =========================================================
   PROFILE
========================================================= */

function openProfile() {

    document
        .querySelectorAll('.page')
        .forEach(function(page) {

            page.classList.remove(
                'active'
            );

        });


    const profile =
        document.getElementById(
            'profile'
        );


    if (
        profile
    ) {

        profile.classList.add(
            'active'
        );

    }

    document.documentElement.style.setProperty('--section-accent', '#2563eb');
    document.documentElement.setAttribute('data-active-section', 'profile');



    document
        .querySelectorAll('.menu-btn')
        .forEach(function(btn) {

            btn.classList.remove(
                'active'
            );

        });

}



/* =========================================================
   LOGOUT
========================================================= */

function logoutUser() {

    const confirmLogout =
        confirm(
            'Are you sure you want to logout?'
        );


    if (
        !confirmLogout
    ) {

        return;

    }


    localStorage.removeItem(
        'logitechLoggedIn'
    );


    localStorage.removeItem(
        'logitechUser'
    );


    localStorage.removeItem(
        'logitechLoginTime'
    );


    window.location.href =
        'login.html';

}



/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        console.log(
            'LOGIS-TECH SYSTEM initialized.'
        );


        /* =================================================
           LOGIN CHECK
        ================================================= */

        loadUserAccount();

        // When returning from a successful invoice save, open the Invoice module automatically.
        const startupParams = new URLSearchParams(window.location.search);
        if (startupParams.get("openModule") === "invoice") {
            const invoiceButton = document.querySelector('.menu-btn[onclick*="showPage(\'invoice\'"]');
            if (invoiceButton) {
                showPage("invoice", invoiceButton);
            }
            startupParams.delete("openModule");
            const remainingQuery = startupParams.toString();
            const cleanUrl = window.location.pathname + (remainingQuery ? "?" + remainingQuery : "") + window.location.hash;
            window.history.replaceState({}, document.title, cleanUrl);
        }


        /* =================================================
           DR DATE
        ================================================= */

        const drDate =
            document.getElementById(
                'drDate'
            );


        if (
            drDate
        ) {

            drDate.value =
                new Date()
                    .toISOString()
                    .split('T')[0];

        }

    }
);

</script>

<script>
/* LOGIS-TECH collapsible sidebar */
(function () {
    const body = document.body;
    const sidebar = document.querySelector(".sidebar");
    const toggle = document.getElementById("sidebarToggle");
    if (!body || !sidebar || !toggle) return;

    const storageKey = "logitechSidebarCollapsed";
    const desktopQuery = window.matchMedia("(min-width: 601px)");

    function setCollapsed(collapsed, persist) {
        body.classList.toggle("sidebar-collapsed", collapsed);
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
        toggle.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
        toggle.innerHTML = '<span aria-hidden="true">' + (collapsed ? "›" : "‹") + '</span>';

        sidebar.querySelectorAll(".menu-btn").forEach(function (button) {
            const label = button.textContent.replace(/\\s+/g, " ").trim();
            if (label) button.title = collapsed ? label : "";
        });

        if (persist) {
            try { localStorage.setItem(storageKey, collapsed ? "true" : "false"); } catch (e) {}
        }
    }

    let saved = false;
    try { saved = localStorage.getItem(storageKey) === "true"; } catch (e) {}
    setCollapsed(desktopQuery.matches && saved, false);

    toggle.addEventListener("click", function () {
        if (!desktopQuery.matches) return;
        setCollapsed(!body.classList.contains("sidebar-collapsed"), true);
    });

    desktopQuery.addEventListener("change", function (event) {
        if (!event.matches) body.classList.remove("sidebar-collapsed");
        else {
            let shouldCollapse = false;
            try { shouldCollapse = localStorage.getItem(storageKey) === "true"; } catch (e) {}
            setCollapsed(shouldCollapse, false);
        }
    });
})();
</script>



<script>
/* Give every sidebar button the same icon/label layout as Messages.
   Each section keeps its own distinct icon when the sidebar is collapsed. */
(function () {
    function normalizeSidebarItems() {
        const iconByPage = {
            dashboard: '🏠',
            messages: '✉️',
            sales: '📄',
            joRegister: '🧾',
            delivery: '🚚',
            fleetAnalytics: '📊',
            fleetDataEntry: '📝',
            invoice: '🧾',
            payment: '💳',
            revolvingFund: '💰',
            reports: '📈',
            settings: '⚙️',
            about: 'ⓘ'
        };
        const labelByPage = {
            dashboard: 'Dashboard',
            messages: 'Messages',
            sales: 'Sales Order',
            joRegister: 'JO Register',
            delivery: 'Delivery',
            fleetAnalytics: 'Fleet & Delivery Analytics',
            fleetDataEntry: 'Fleet & Delivery Data Entry',
            invoice: 'Invoice',
            payment: 'Payment',
            revolvingFund: 'Revolving Fund',
            reports: 'Reports',
            settings: 'Settings',
            about: 'About LOGIS-TECH'
        };

        document.querySelectorAll('.sidebar .menu .menu-btn').forEach(function (button) {
            const action = button.getAttribute('onclick') || '';
            const match = action.match(/showPage\(['"]([^'"]+)['"]/);
            const page = match ? match[1] : '';
            const raw = (button.textContent || '').replace(/\s+/g, ' ').trim();
            const icon = iconByPage[page] || '•';
            const label = labelByPage[page] || raw.replace(/^\S+\s*/, '') || raw;

            button.innerHTML = '';
            const iconSpan = document.createElement('span');
            iconSpan.className = 'sidebar-item-icon';
            iconSpan.setAttribute('aria-hidden', 'true');
            iconSpan.textContent = icon;

            const labelSpan = document.createElement('span');
            labelSpan.className = 'sidebar-item-label';
            labelSpan.textContent = label;

            button.appendChild(iconSpan);
            button.appendChild(labelSpan);
            button.dataset.sidebarNormalized = 'true';
            button.setAttribute('aria-label', label);
            button.title = label;
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', normalizeSidebarItems);
    } else {
        normalizeSidebarItems();
    }
})();
</script>
