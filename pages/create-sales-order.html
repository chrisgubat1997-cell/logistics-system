<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Create Sales Order</title>

    <link
        rel="stylesheet"
        href="../css/create-sales-order.css"
    >

</head>

<body>

    <div class="create-so-container">

        <div class="page-header">

            <div>

                <h1>Create Sales Order</h1>

                <p class="subtitle">
                    Create a new Sales Order
                </p>

            </div>

            <button
                class="btn btn-secondary"
                onclick="closeCreateSO()"
            >
                BACK
            </button>

        </div>


        <!-- SO INFORMATION -->

        <div class="section">

            <div class="form-grid">

                <div class="form-group">

                    <label>Date Creation</label>

                    <input
                        type="date"
                        id="soDate"
                    >

                </div>


                <div class="form-group">

                    <label>Sales Order Number</label>

                    <input
                        type="text"
                        id="soNumber"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label>Client Name</label>

                    <input
                        type="text"
                        id="clientName"
                        placeholder="Enter client name"
                    >

                </div>


                <div class="form-group">

                    <label>Attention</label>

                    <input
                        type="text"
                        id="attention"
                        placeholder="Enter contact person"
                    >

                </div>


                <div class="form-group full">

                    <label>Billing Address</label>

                    <input
                        type="text"
                        id="billingAddress"
                        placeholder="Enter billing address"
                    >

                </div>


                <div class="form-group full">

                    <label>Delivery Address</label>

                    <input
                        type="text"
                        id="deliveryAddress"
                        placeholder="Enter delivery address"
                    >

                </div>


                <div class="form-group">

                    <label>Project</label>

                    <input
                        type="text"
                        id="project"
                        placeholder="Enter project"
                    >

                </div>


                <div class="form-group">

                    <label>TIN Number</label>

                    <input
                        type="text"
                        id="tinNumber"
                        placeholder="Enter TIN number"
                    >

                </div>


                <div class="form-group">

                    <label>PO Number</label>

                    <input
                        type="text"
                        id="poNumber"
                        placeholder="Enter PO number"
                    >

                </div>


                <div class="form-group">

                    <label>Terms</label>

                    <select id="terms">

                        <option value="">
                            Select Terms
                        </option>

                        <option value="COD">
                            COD
                        </option>

                        <option value="15 Days">
                            15 Days
                        </option>

                        <option value="30 Days">
                            30 Days
                        </option>

                        <option value="45 Days">
                            45 Days
                        </option>

                        <option value="60 Days">
                            60 Days
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>SE</label>

                    <select id="soSE">

                        <option value="">
                            Select SE
                        </option>

                        <option value="JBG">JBG</option>
                        <option value="MHT">MHT</option>
                        <option value="HHF">HHF</option>
                        <option value="IAF">IAF</option>
                        <option value="GRF">GRF</option>
                        <option value="KBO">KBO</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Job Order</label>

                    <input
                        type="text"
                        id="jobOrder"
                        placeholder="Enter Job Order"
                    >

                </div>

            </div>

        </div>


        <!-- ITEMS -->

        <div class="section">

            <div class="table-header">

                <h2>Items</h2>

                <button
                    class="btn btn-primary"
                    onclick="addSOItem()"
                >
                    + ADD ITEM
                </button>

            </div>


            <div class="table-container">

                <table id="soItemsTable">

                    <thead>

                        <tr>

                            <th>#</th>
                            <th>Item Name</th>
                            <th>Description</th>
                            <th>QTY</th>
                            <th>Unit</th>
                            <th>Amount</th>
                            <th>Total</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="soItemsBody">
                    </tbody>

                </table>

            </div>


            <!-- TOTALS -->

            <div class="so-totals">

                <div class="so-total-row">

                    <span class="so-total-label">
                        Subtotal
                    </span>

                    <span
                        class="so-total-value"
                        id="soSubtotal"
                    >
                        ₱0.00
                    </span>

                </div>


                <div class="so-total-row">

                    <label
                        class="so-total-label"
                        for="soDiscount"
                    >
                        Less Discount
                    </label>

                    <input
                        type="number"
                        id="soDiscount"
                        class="so-total-input"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="0.00"
                        oninput="calculateSOTotals()"
                    >

                </div>


                <div class="so-total-row">

                    <label class="so-total-label">

                        <span class="vatable-check">

                            <input
                                type="checkbox"
                                id="soVatable"
                                onchange="calculateSOTotals()"
                            >

                            Vatable

                        </span>

                    </label>


                    <span
                        class="so-total-value"
                        id="soVAT"
                    >
                        ₱0.00
                    </span>

                </div>


                <div class="so-total-row">

                    <span class="so-total-label">
                        VAT Rate
                    </span>

                    <span class="so-total-value">
                        12%
                    </span>

                </div>


                <div class="so-total-row grand-total-row">

                    <span class="so-total-label">
                        GRAND TOTAL
                    </span>

                    <span
                        class="so-total-value"
                        id="soGrandTotal"
                    >
                        ₱0.00
                    </span>

                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="action-bar">

            <button
                class="btn btn-secondary"
                onclick="closeCreateSO()"
            >
                CANCEL
            </button>


            <button
                class="btn btn-primary"
                onclick="saveSO()"
            >
                SAVE SO
            </button>

        </div>

    </div>


    <script src="../js/create-sales-order.js"></script>

</body>

</html>
