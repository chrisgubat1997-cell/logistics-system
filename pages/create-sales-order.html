<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Create Sales Order</title>

    <link
        rel="stylesheet"
        href="../css/create-sales-order.css"
    >

</head>

<body>

    <div class="create-so-container">

        <!-- =====================================================
             PAGE HEADER
        ====================================================== -->

        <div class="page-header">

            <div>

                <h1>Create Sales Order</h1>

                <p class="subtitle">
                    Create a new Sales Order
                </p>

            </div>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="closeCreateSO()"
            >
                BACK
            </button>

        </div>


        <!-- =====================================================
             SO INFORMATION
        ====================================================== -->

        <div class="section">

            <div class="form-grid">

                <!-- DATE -->

                <div class="form-group">

                    <label for="soDate">
                        Date Creation
                    </label>

                    <input
                        type="date"
                        id="soDate"
                    >

                </div>


                <!-- SO NUMBER -->

                <div class="form-group">

                    <label for="soNumber">
                        Sales Order Number
                    </label>

                    <input
                        type="text"
                        id="soNumber"
                        readonly
                    >

                </div>


                <!-- CLIENT -->

                <div class="form-group">

                    <label for="clientName">
                        Client Name
                    </label>

                    <input
                        type="text"
                        id="clientName"
                        placeholder="Enter client name"
                    >

                </div>


                <!-- ATTENTION -->

                <div class="form-group">

                    <label for="attention">
                        Attention
                    </label>

                    <input
                        type="text"
                        id="attention"
                        placeholder="Enter contact person"
                    >

                </div>


                <!-- BILLING ADDRESS -->

                <div class="form-group full">

                    <label for="billingAddress">
                        Billing Address
                    </label>

                    <input
                        type="text"
                        id="billingAddress"
                        placeholder="Enter billing address"
                    >

                </div>


                <!-- DELIVERY ADDRESS -->

                <div class="form-group full">

                    <label for="deliveryAddress">
                        Delivery Address
                    </label>

                    <input
                        type="text"
                        id="deliveryAddress"
                        placeholder="Enter delivery address"
                    >

                </div>


                <!-- PROJECT -->

                <div class="form-group">

                    <label for="project">
                        Project
                    </label>

                    <input
                        type="text"
                        id="project"
                        placeholder="Enter project"
                    >

                </div>


                <!-- TIN -->

                <div class="form-group">

                    <label for="tinNumber">
                        TIN Number
                    </label>

                    <input
                        type="text"
                        id="tinNumber"
                        placeholder="Enter TIN number"
                    >

                </div>


                <!-- PO NUMBER -->

                <div class="form-group">

                    <label for="poNumber">
                        PO Number
                    </label>

                    <input
                        type="text"
                        id="poNumber"
                        placeholder="Enter PO number"
                    >

                </div>


                <!-- TERMS -->

                <div class="form-group">

                    <label for="terms">
                        Terms
                    </label>

                    <select id="terms">

                        <option value="">
                            Select Terms
                        </option>

                        <option value="COD">
                            COD
                        </option>

                        <option value="15 Days">
                            15 Days
                        </option>

                        <option value="30 Days">
                            30 Days
                        </option>

                        <option value="45 Days">
                            45 Days
                        </option>

                        <option value="60 Days">
                            60 Days
                        </option>

                    </select>

                </div>


                <!-- SE -->

                <div class="form-group">

                    <label for="soSE">
                        SE
                    </label>

                    <select id="soSE">

                        <option value="">
                            Select SE
                        </option>

                        <option value="JBG">
                            JBG
                        </option>

                        <option value="MHT">
                            MHT
                        </option>

                        <option value="HHF">
                            HHF
                        </option>

                        <option value="IAF">
                            IAF
                        </option>

                        <option value="GRF">
                            GRF
                        </option>

                        <option value="KBO">
                            KBO
                        </option>

                    </select>

                </div>


                <!-- JOB ORDER -->

                <div class="form-group">

                    <label for="jobOrder">
                        Job Order
                    </label>

                    <input
                        type="text"
                        id="jobOrder"
                        placeholder="Enter Job Order"
                    >

                </div>

            </div>

        </div>


        <!-- =====================================================
             ITEMS
        ====================================================== -->

        <div class="section">

            <div class="table-header">

                <div>

                    <h2>
                        Items
                    </h2>

                    <p class="subtitle">
                        Add Sales Order items
                    </p>

                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="addSOItem()"
                >
                    + ADD ITEM
                </button>

            </div>


            <div class="table-container">

                <table id="soItemsTable">

                    <thead>

                        <tr>

                            <th>#</th>

                            <th>
                                Item Name
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                QTY
                            </th>

                            <th>
                                Unit
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="soItemsBody">
                    </tbody>

                </table>

            </div>


            <!-- =================================================
                 TOTALS
            ================================================== -->

            <div class="so-totals">

                <!-- SUBTOTAL -->

                <div class="so-total-row">

                    <span class="so-total-label">
                        Subtotal
                    </span>

                    <span
                        class="so-total-value"
                        id="soSubtotal"
                    >
                        ₱0.00
                    </span>

                </div>


                <!-- DISCOUNT -->

                <div class="so-total-row">

                    <label
                        class="so-total-label"
                        for="soDiscount"
                    >
                        Less Discount
                    </label>

                    <input
                        type="number"
                        id="soDiscount"
                        class="so-total-input"
                        min="0"
                        step="0.01"
                        value="0"
                        placeholder="0.00"
                        oninput="calculateSOTotals()"
                    >

                </div>


                <!-- VATABLE -->

                <div class="so-total-row">

                    <label class="so-total-label">

                        <span class="vatable-check">

                            <input
                                type="checkbox"
                                id="soVatable"
                                onchange="calculateSOTotals()"
                            >

                            Vatable

                        </span>

                    </label>


                    <span
                        class="so-total-value"
                        id="soVAT"
                    >
                        ₱0.00
                    </span>

                </div>


                <!-- VAT RATE -->

                <div class="so-total-row">

                    <span class="so-total-label">
                        VAT Rate
                    </span>

                    <span class="so-total-value">
                        12%
                    </span>

                </div>


                <!-- GRAND TOTAL -->

                <div class="so-total-row grand-total-row">

                    <span class="so-total-label">
                        GRAND TOTAL
                    </span>

                    <span
                        class="so-total-value"
                        id="soGrandTotal"
                    >
                        ₱0.00
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
             SO FILES
        ====================================================== -->

        <div class="section">

            <div class="table-header">

                <div>

                    <h2>
                        SO Files
                    </h2>

                    <p class="subtitle">
                        Upload supporting Sales Order PDF files
                    </p>

                </div>


                <label
                    for="soFileInput"
                    class="btn btn-primary upload-file-btn"
                >
                    📎 + UPLOAD FILE
                </label>


                <input
                    type="file"
                    id="soFileInput"
                    accept=".pdf,application/pdf"
                    multiple
                    hidden
                >

            </div>


            <div
                id="soFileList"
                class="so-file-list"
            >

                <div class="no-files">
                    No files selected.
                </div>

            </div>

        </div>


        <!-- =====================================================
             ACTIONS
        ====================================================== -->

        <div class="action-bar">

            <button
                type="button"
                class="btn btn-secondary"
                onclick="closeCreateSO()"
            >
                CANCEL
            </button>


            <button
                type="button"
                class="btn btn-primary"
                onclick="saveSO()"
            >
                SAVE SO
            </button>

        </div>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="../js/create-sales-order.js"></script>

</body>

</html>
