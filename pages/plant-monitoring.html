<section class="plant-monitoring" id="plantMonitoringApp">
  <header class="plant-header">
    <div><span class="plant-eyebrow">PRODUCTION CONTROL</span><h1>Plant Monitoring</h1><p>Track production progress per Sales Order and per item.</p></div>
    <button type="button" class="plant-refresh" id="plantRefresh">↻ Refresh</button>
  </header>
  <div class="plant-toolbar">
    <div class="plant-mode" role="group" aria-label="Monitoring view">
      <button type="button" class="active" data-plant-mode="so">Per SO</button>
      <button type="button" data-plant-mode="item">Per Item</button>
    </div>
    <label>SO Number<select id="plantFilterSO"><option value="">All Sales Orders</option></select></label>
    <label>JO Number<input id="plantFilterJO" type="search" placeholder="Search JO"></label>
    <label>Item Name<input id="plantFilterItem" type="search" placeholder="Search item"></label>
    <label>Status<select id="plantFilterStatus"><option value="">All Status</option><option>COMPLETED</option><option>ONGOING</option><option>PENDING</option><option>ON HOLD</option></select></label>
  </div>
  <div class="plant-cards" id="plantCards"></div>
  <div class="plant-message" id="plantMessage" role="status">Loading production records…</div>
  <section class="plant-panel">
    <div class="plant-panel-head"><div><h2 id="plantTableTitle">Sales Order Progress</h2><p id="plantCount">0 records</p></div><div class="plant-panel-actions"><button type="button" class="plant-bulk-update" id="plantBulkUpdate" disabled>Update Selected Items <span id="plantSelectedCount">0</span></button><span class="plant-live"><i></i> Live database</span></div></div>
    <div class="plant-table-wrap"><table class="plant-table"><thead id="plantHead"></thead><tbody id="plantRows"><tr><td>Loading…</td></tr></tbody></table></div>
  </section>
</section>
<div class="plant-modal" id="plantProgressModal" hidden>
  <form class="plant-modal-card" id="plantProgressForm">
    <button type="button" class="plant-modal-close" id="plantModalClose" aria-label="Close">×</button>
    <span class="plant-eyebrow">UPDATE PRODUCTION</span><h2 id="plantModalTitle">Item Progress</h2><p id="plantModalMeta"></p>
    <div class="plant-bulk-items" id="plantBulkItems"></div>
    <p class="plant-validation" id="plantValidation">Total allocated quantity per item must not exceed its ordered quantity.</p>
    <div class="plant-modal-actions"><button type="button" class="plant-cancel" id="plantModalCancel">Cancel</button><button type="submit" class="plant-save" id="plantSave">Save Progress</button></div>
  </form>
</div>
