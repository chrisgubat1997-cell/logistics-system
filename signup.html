<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LOGI-TECH | Sign Up</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">


            <!-- =========================================
                 LOGO
            ========================================== -->

            <div class="logo-container">

                <img
                    src="assets/logo.png"
                    alt="LOGI-TECH Logo"
                >

            </div>


            <!-- =========================================
                 TITLE
            ========================================== -->

            <h1>
                CREATE ACCOUNT
            </h1>

            <p class="subtitle">
                Create your LOGI-TECH account
            </p>


            <!-- =========================================
                 SIGN UP FORM
            ========================================== -->

            <form
                id="signupForm"
                autocomplete="on"
            >


                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="signupUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signupUsername"
                        name="username"
                        placeholder="Create username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- ACCOUNT TYPE -->

                <div class="input-group">

                    <label for="accountType">
                        Account Type
                    </label>

                    <select
                        id="accountType"
                        name="accountType"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select account type
                        </option>

                        <option value="SALES">
                            SALES
                        </option>

                        <option value="LOGISTICS">
                            LOGISTICS
                        </option>

                        <option value="FINANCE">
                            FINANCE
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="signupButton"
                    class="login-btn"
                >
                    CREATE ACCOUNT
                </button>


            </form>


            <!-- =========================================
                 MESSAGE
            ========================================== -->

            <p
                id="signupMessage"
                aria-live="polite"
            ></p>


            <!-- =========================================
                 BACK TO LOGIN
            ========================================== -->

            <div class="login-links">

                <a href="login.html">
                    Back to Login
                </a>

            </div>


        </div>

    </div>


    <!-- =============================================
         JAVASCRIPT
    ============================================== -->

    <script src="js/signup.js"></script>


</body>

</html>
