<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LOGI-TECH | Sign Up</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo-container">

                <img
                    src="assets/logo.jfif"
                    alt="LOGI-TECH Logo"
                >

            </div>


            <!-- TITLE -->
            <h1>CREATE ACCOUNT</h1>

            <p class="subtitle">
                Create your LOGI-TECH account
            </p>


            <!-- SIGN UP FORM -->
            <form id="signupForm">

                <!-- FULL NAME -->
                <div class="input-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <!-- USERNAME -->
                <div class="input-group">

                    <label for="signupUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="signupUsername"
                        placeholder="Create username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="login-btn">

                    CREATE ACCOUNT

                </button>

            </form>


            <!-- MESSAGE -->
            <p id="signupMessage"></p>


            <!-- NAVIGATION -->
            <div class="login-links">

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="js/signup.js"></script>

</body>

</html>
